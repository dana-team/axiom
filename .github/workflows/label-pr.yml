name: Label PR by Conventional Commit

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize]

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Apply label from PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(\w+)(\(.+\))?!?:/);
            if (!match) {
              console.log('PR title does not follow conventional commits format, skipping.');
              return;
            }

            const typeToLabel = {
              feat:     'feat',
              fix:      'fix',
              chore:    'chore',
              docs:     'docs',
              refactor: 'refactor',
              ci:       'ci',
              test:     'test',
              perf:     'chore',
              build:    'chore',
              style:    'chore',
              revert:   'fix',
            };

            const type = match[1];
            const label = typeToLabel[type];
            if (!label) {
              console.log(`Unknown commit type "${type}", skipping.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            console.log(`Applied label "${label}" for type "${type}".`);
